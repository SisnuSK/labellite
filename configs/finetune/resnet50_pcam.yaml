# Full fine-tuning of ImageNet-pretrained ResNet-50 (timm resnet50.tv2_in1k) on PCam.
model: resnet50
dataset: pcam
label_budgets: [0.01, 0.1, 1.0]
seeds: [0, 1, 2]
epochs: {0.01: 60, 0.1: 30, 1.0: 10}
evals_per_run: 15
early_stopping_patience: 4
batch_size: 128
lr: 1.0e-4
weight_decay: 0.05
warmup_fraction: 0.05
input_size: 224
color_jitter: true
mixed_precision: true
deterministic: false
device: cuda
