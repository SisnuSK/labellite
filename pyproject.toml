[project]
name = "labellite"
version = "0.1.0"
description = "Label-efficient, uncertainty-aware image analysis with frozen vision foundation models."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "timm==1.0.30",
    "open_clip_torch==3.3.0",
    "scikit-learn==1.9.1",
    "numpy>=2.2,<3",
    "scipy>=1.14",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "safetensors>=0.5",
    "huggingface_hub>=0.30",
    "pydantic>=2.10,<3",
    "pyyaml>=6.0",
    "typer>=0.15",
    "h5py>=3.12",
    "pillow>=11",
    "transformers>=5.0,<6",
    "scikit-image>=0.25",
]

# torch/torchvision come from the PyTorch index, so exactly one of these extras must be chosen:
#   uv sync --extra gpu   (CUDA 13.0 wheels; local GPU machine)
#   uv sync --extra cpu   (CPU wheels; CI and the Docker app image)
[project.optional-dependencies]
cpu = ["torch==2.14.1", "torchvision==0.29.1"]
gpu = ["torch==2.14.1", "torchvision==0.29.1"]

[project.scripts]
labellite = "labellite.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff==0.17.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labellite"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "gpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.ruff.lint.per-file-ignores]
# Tests check legacy global NumPy seeding on purpose.
"tests/*" = ["NPY002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
